apiVersion: v1
kind: ConfigMap
metadata:
  namespace: crm
  name: config
data:
  SPRING_PROFILES_ACTIVE: 'postgres'

  USER_SERVICE_DB_URL: 'jdbc:postgresql://postgres-service:5432/userdb'
  CRM_SERVICE_DB_URL: 'jdbc:postgresql://postgres-service:5432/crmdb'
  NOTIFICATION_SERVICE_DB_URL: 'jdbc:postgresql://postgres-service:5432/notificationdb'
  AUDIT_SERVICE_DB_URL: 'jdbc:postgresql://postgres-service:5432/auditdb'
  FILE_SERVICE_DB_URL: 'jdbc:postgresql://postgres-service:5432/filedb'

  USER_SERVICE_URL: 'http://user-service:8081'
  CRM_SERVICE_URL: 'http://crm-service:8082'
  NOTIFICATION_SERVICE_URL: 'http://notification-service:8083'
  FILE_SERVICE_URL: 'http://file-service:8084'
  AUDIT_SERVICE_URL: 'http://audit-service:8085'
  REPORTING_SERVICE_URL: 'http://reporting-service:8086'

  FILE_STORAGE_PATH: '/data/files'
