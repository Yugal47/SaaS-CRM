apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: crm
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: yugal47/saas-crm-user-service:latest
        ports:
          - containerPort: 8081
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: config
              key: USER_SERVICE_DB_URL
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 512Mi
#        startupProbe:
#          httpGet:
#            path: /actuator/health
#            port: 8081
#          periodSeconds: 5
#          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  namespace: crm
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081

---
