apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-service-storage
  namespace: crm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: crm
  name: file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
      - name: file-service
        image: yugal47/saas-crm-file-service:latest
        ports:
          - containerPort: 8084
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: config
              key: FILE_SERVICE_DB_URL
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 40
          periodSeconds: 15
        volumeMounts:
          - name: file-storage
            mountPath: /data/files
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: file-service-storage
---
apiVersion: v1
kind: Service
metadata:
  namespace: crm
  name: file-service
spec:
  selector:
    app: file-service
  ports:
  - port: 8084
    targetPort: 8084
