apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-service-storage
  namespace: crm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: crm
  labels:
    app: file-service
spec:
  # Stays at 1 replica: it writes uploads to a ReadWriteOnce volume, so a
  # second pod couldn't reliably see the same files. Swap FileStorageService
  # for an S3 client to remove this constraint and scale like the others.
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: yugal47/saas-crm-file-service:latest
          ports:
            - containerPort: 8084
#          envFrom:
#            - configMapRef:
#                name: config
#            - secretRef:
#                name: secrets
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: FILE_SERVICE_DB_URL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: file-storage
              mountPath: /data/files
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: file-service-storage
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: crm
spec:
  selector:
    app: file-service
  ports:
    - port: 8084
      targetPort: 8084
---
