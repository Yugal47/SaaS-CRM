apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: crm
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: yugal47/saas-crm-audit-service:latest # e.g. <account>.dkr.ecr.<region>.amazonaws.com/audit-service:latest
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: secrets
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                    name: config
                    key: AUDIT_SERVICE_DB_URL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            timeoutSeconds: 3
            failureThreshold: 3
            #initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            #initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: crm
spec:
  selector:
    app: audit-service
  ports:
    - port: 8085
      targetPort: 8085
---
