server {
    listen 80;
    server_name _;

    # React app (client-side routing - fall back to index.html for unknown paths)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy API calls to the gateway service. "gateway-service" resolves via
    # Docker Compose's internal DNS since both containers are on the same
    # default network - this is the container-network equivalent of what
    # vite.config.js's dev-server proxy does for `npm run dev`.
    location /api/ {
        proxy_pass http://gateway-service:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
